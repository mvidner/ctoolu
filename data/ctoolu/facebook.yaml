- label: Facebook link
  regex: '(https://l\.facebook\.com/[^[:space:]]*)'
  commands:
  - label: Strip tracking
    command: fblink '%s'
    keep_output: true
- label: Facebook tracking
  regex: '(https?://[^[:space:]]*[?&]fbclid=[^[:space:]]*)'
  commands:
  - label: Strip tracking
    command: fblink '%s'
    keep_output: true
- label: Google News link
  regex: '(https://news\.google\.com/[^[:space:]]*)'
  commands:
  - label: Strip tracking
    command: fblink '%s'
    keep_output: true
- label: Twitter Link
  regex: '(https://t\.co/[^[:space:]]*)'
  commands:
  - label: Strip tracking
    command: fblink '%s'
    keep_output: true
